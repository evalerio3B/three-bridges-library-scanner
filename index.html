<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three Bridges Library — Camera</title>
<style>
:root{font-family:Montserrat,Arial,sans-serif;color:#173e60;background:#eaf4f9}*{box-sizing:border-box}
body{margin:0;padding:18px;max-width:650px;margin-inline:auto}header{text-align:center}h1{font-size:24px}
video{display:block;width:100%;max-height:58vh;object-fit:cover;background:#112d43;border-radius:15px}
button{width:100%;padding:16px;background:#008f91;border:0;border-radius:12px;color:white;font:700 17px inherit;margin:12px 0;cursor:pointer}
.panel{background:white;border-radius:15px;padding:16px;margin-top:12px;box-shadow:0 2px 10px #1233}
#code{overflow-wrap:anywhere;font-size:19px;font-weight:700}#status{font-weight:600}small{color:#52697b}
</style></head><body>
<header><h1>📚 Three Bridges Library</h1><p>Camera barcode scanner</p></header>
<video id="video" playsinline muted></video>
<button id="start">Start camera</button>
<div class="panel"><div id="status">Open this scanner from the library app.</div><p id="code"></p><small id="help">Keep the library app open in the other window. Choose Borrow, Return, Find a Book or Catalogue there.</small></div>
<script>
const video=document.getElementById('video');
const statusEl=document.getElementById('status');
const codeEl=document.getElementById('code');
const startBtn=document.getElementById('start');
const session=new URLSearchParams(location.hash.slice(1)).get('session');
// Never expose pupil names, loan records or credentials on this public page.
let detector,stream,running=false,waiting=false,lastCode='',lastAt=0,audioContext;
function beep(ok=true){try{audioContext ||= new (window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime;o.type='sine';o.frequency.value=ok?880:260;g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.13)}catch(e){}}
window.addEventListener('message',event=>{
 if(event.source!==window.opener || !event.data || event.data.app!=='TB_LIBRARY_ACK' || event.data.session!==session)return;
 waiting=false;
 if(event.data.status==='ok'){statusEl.textContent='✓ Sent to library';beep(true)}
 else if(event.data.status==='busy'){statusEl.textContent='Library is processing. Try again.'}
 else {statusEl.textContent='Library reported a problem. Check the other window.';beep(false)}
});
async function start(){
 if(!window.opener||!session){statusEl.textContent='Please open this page using Open Camera Scanner in the library app.';return}
 if(!('BarcodeDetector' in window)){statusEl.textContent='This browser does not support camera barcode detection. Use a compatible Chrome browser.';return}
 try{
  detector=new BarcodeDetector({formats:['ean_13','code_128']});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();running=true;startBtn.textContent='Stop camera';statusEl.textContent='Ready to scan';scanLoop();
 }catch(e){statusEl.textContent='Could not start camera: '+e.message}
}
function stop(){running=false;stream?.getTracks().forEach(t=>t.stop());video.srcObject=null;startBtn.textContent='Start camera'}
async function scanLoop(){
 while(running){
  try{
   const codes=await detector.detect(video);
   const code=codes.map(x=>String(x.rawValue||'').trim()).find(x=>/^(?:TBP-[A-Z0-9]{10}|\d{13}|\d{9}[\dX])$/.test(x));
   const now=Date.now();
   if(code && !waiting && (code!==lastCode || now-lastAt>2300)){
    lastCode=code;lastAt=now;waiting=true;codeEl.textContent=code;statusEl.textContent='Sending scan...';
    window.opener.postMessage({app:'TB_LIBRARY_SCANNER',session,type:'scan',code},'*');
    // If the library window is gone, don't freeze the scanner forever.
    setTimeout(()=>{if(waiting){waiting=false;statusEl.textContent='No reply from library. Check that its window is open.'}},12000);
   }
  }catch(e){statusEl.textContent='Scanning error: '+e.message}
  await new Promise(resolve=>setTimeout(resolve,160));
 }
}
startBtn.addEventListener('click',()=>running?stop():start());
window.addEventListener('pagehide',stop);
</script></body></html>
